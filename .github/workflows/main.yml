名称: 刷课
 
开启: 
 推送:
    分支: [ 主分支 ]
  #是否开始每天8点定时刷课，若要开启请把下面两行注释去掉
  #schedule:
  #  - cron: "0 8 * * *" 
    
jobs: 
  Start:
    运行环境: ubuntu-latest # 在最新版本的 Ubuntu 操作系统环境下运行
    步骤: # 要执行的步骤
      - 名称: 拷贝代码
        用途: actions/checkout@v4  # 用于将github代码仓库的代码拷贝到工作目录中
 
      - 名称: 设置python环境
用途: actions/setup-python@v5 # 用于设置 Python 环境，它允许你指定要在工作环境中使用的 Python 版本
        使用:
          python-version: '3.13'  # 选择要用的Python版本
 
      - 名称: 安装依赖包
        run: | # 安装依赖包
          pip install -r ./requirements.txt 
          
      
      - 名称: 运行 main.py
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
        运行: python main.py -u "18759721913" -p "ye350820" -l "223019451"
